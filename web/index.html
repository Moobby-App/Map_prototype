<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d24">
  <title>KRL Jakarta · Schedule Map</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">JAKARTA KRL NETWORK</p>
      <h1>Railway Map <span>REAL WIB CLOCK</span></h1>
    </div>
    <div class="network-key" aria-label="KRL service">
      <span><i class="dot krl"></i>KRL</span>
    </div>
  </header>

  <main>
    <div id="map" aria-label="Interactive Jakarta railway map"></div>

    <aside class="summary panel" aria-label="Map status">
      <div class="status-row"><span class="status-light"></span><p id="status" role="status">Connecting to Apple Maps…</p></div>
      <div class="service-status-row"><span class="service-status-light"></span><p id="service-status" role="status">Terjadwal</p></div>
      <p id="source" class="hint">Loading schedule data…</p>
      <div class="map-filters">
        <label for="day-type">Jadwal</label>
        <select id="day-type" aria-label="Pilih jenis jadwal">
          <option value="weekday">Hari kerja</option>
          <option value="sunday">Minggu</option>
        </select>
      </div>
      <p id="saturday-note" class="hint saturday-note" role="status" hidden></p>
      <div id="demo-label" class="demo-label" hidden>DEMO DATA</div>
      <p id="counts" class="stats"></p>
      <p id="warnings" class="hint warning"></p>
      <button id="retry" class="quiet-button" hidden type="button">Retry connection</button>
    </aside>

    <section id="debug-panel" class="debug-panel panel" aria-label="Live polling debug" hidden>
      <p>LIVE POLLING DEBUG</p>
      <pre id="debug-info">Waiting for poll status…</pre>
    </section>

    <section id="details" class="details panel" hidden aria-label="Selected station or train">
      <button id="close-details" class="close-button" type="button" aria-label="Close details">×</button>
      <p id="detail-kicker" class="detail-kicker"></p>
      <h2 id="detail-title"></h2>
      <p id="detail-body" class="detail-body"></p>
      <ol id="detail-list" class="detail-list"></ol>
    </section>

    <div class="bottom-dock">
      <p class="disclaimer" lang="id"><span class="badge-mark" aria-hidden="true">≈</span>Posisi estimasi berdasarkan jadwal, bukan GPS.</p>
      <section class="clock-panel panel" aria-label="Current Jakarta time">
        <div class="clock-block">
          <output id="clock">00:00</output>
          <small>WAKTU NYATA · WIB</small>
        </div>
        <span id="active-count">0 active</span>
      </section>
    </div>
  </main>
</body>
</html>
